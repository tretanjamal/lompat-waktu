/* pengaman-ringan: tanpa klik kanan, salin, potong, tempel, dan Ctrl+U, tanpa pemberitahuan. Salinan dari tombol gim sendiri (kotak teks tersembunyi) tetap jalan. */
(function () {
  function cegah(e) { if (e.type === 'copy' && e.target && e.target.tagName === 'TEXTAREA') return; e.preventDefault(); }
  ['contextmenu', 'copy', 'cut', 'paste'].forEach(function (n) { document.addEventListener(n, cegah, true); });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) e.preventDefault(); }, true);
})();
</script>
